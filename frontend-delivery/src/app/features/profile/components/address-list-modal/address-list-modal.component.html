<div class="bg-card border border-gray rounded-[2rem] flex flex-col shadow-2xl max-w-lg w-full overflow-hidden mx-auto">
    <div class="flex justify-between items-center p-6 border-b border-gray">
        <h3 class="text-xl font-bold text-white">Meus Endereços</h3>
        
        <button (click)="close()" class="text-subtext hover:text-white transition-colors p-2 rounded-full hover:bg-gray cursor-pointer">
            <lucide-icon name="x" class="w-6 h-6"></lucide-icon>
        </button>
    </div>

    <div class="p-6 flex flex-col gap-4 max-h-[70vh] overflow-y-auto scrollbar-hide">
        @for (addr of addresses; track addr.id) {
            <div class="flex items-start gap-4 p-4 rounded-xl border border-gray bg-background transition-all duration-300 group">
                <div class="mt-1 shrink-0">
                    <div class="w-10 h-10 rounded-full border border-gray text-subtext flex items-center justify-center">
                        <lucide-icon name="map-pin" class="w-5 h-5"></lucide-icon>
                    </div>
                </div>

                <div class="flex flex-col flex-1">
                    <div class="flex justify-between items-start gap-2">
                        <span class="text-white font-bold text-base leading-tight">{{ addr.street }}, {{ addr.number }}</span>
                        
                        @if (addr.isDefault) {
                            <span class="text-[10px] font-bold uppercase tracking-wider bg-primary/20 text-primary px-2 py-0.5 rounded-md shrink-0">Principal</span>
                        }
                    </div>

                    <span class="text-subtext text-sm mt-1">{{ addr.type }} • {{ addr.neighborhood }}</span>
                    <span class="text-subtext text-xs mt-0.5">{{ addr.city }} - {{ addr.state }}</span>
                </div>
                
                <button (click)="editAddress(addr)" class="p-2 rounded-lg bg-card border border-gray text-subtext hover:text-primary hover:border-primary transition-all cursor-pointer">
                    <lucide-icon name="pencil" class="w-4 h-4"></lucide-icon>
                </button>
            </div>
        }
        
        @if (addresses.length === 0) {
            <div class="text-center text-subtext py-6">
                Você ainda não tem endereços cadastrados.
            </div>
        }
    </div>
</div>
