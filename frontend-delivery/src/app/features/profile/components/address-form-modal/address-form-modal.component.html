<div class="bg-card border border-gray rounded-[2rem] flex flex-col shadow-2xl max-w-2xl w-full overflow-hidden mx-auto">
    <div class="flex justify-between items-center p-6 border-b border-gray">
        <h3 class="text-xl font-bold text-white">{{ isEdit ? 'Editar Endereço' : 'Novo Endereço' }}</h3>
        
        <button (click)="close()" class="text-subtext hover:text-white transition-colors p-2 rounded-full hover:bg-gray cursor-pointer">
            <lucide-icon name="x" class="w-6 h-6"></lucide-icon>
        </button>
    </div>
    
    <form [formGroup]="addressForm" (ngSubmit)="save()" class="p-6 flex flex-col gap-4 max-h-[80vh] overflow-y-auto scrollbar-hide">
        <div class="flex flex-col gap-1">
            <label class="text-white text-sm font-medium">CEP</label>
            <input formControlName="cep" type="text" maxlength="8" placeholder="Ex: 13840000" (input)="onCepChange($event)" class="w-full bg-background text-white border border-gray rounded-xl py-3 px-4 outline-none focus:border-primary transition-colors placeholder:text-subtext">
        </div>

        <div class="flex gap-4">
            <div class="flex flex-col gap-1 flex-1">
                <label class="text-white text-sm font-medium">Rua</label>
                <input formControlName="street" type="text" class="w-full bg-background text-white border border-gray rounded-xl py-3 px-4 outline-none focus:border-primary transition-colors">
            </div>

            <div class="flex flex-col gap-1 w-28">
                <label class="text-white text-sm font-medium">Número</label>
                <input formControlName="number" type="text" class="w-full bg-background text-white border border-gray rounded-xl py-3 px-4 outline-none focus:border-primary transition-colors">
            </div>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-white text-sm font-medium">Bairro</label>
            <input formControlName="neighborhood" type="text" class="w-full bg-background text-white border border-gray rounded-xl py-3 px-4 outline-none focus:border-primary transition-colors">
        </div>

        <div class="flex gap-4">
            <div class="flex flex-col gap-1 flex-1">
                <label class="text-white text-sm font-medium">Cidade</label>
                <input formControlName="city" type="text" class="w-full bg-background text-white border border-gray rounded-xl py-3 px-4 outline-none focus:border-primary transition-colors">
            </div>

            <div class="flex flex-col gap-1 w-24">
                <label class="text-white text-sm font-medium">UF</label>
                <input formControlName="state" type="text" maxlength="2" class="w-full bg-background text-white border border-gray rounded-xl py-3 px-4 outline-none focus:border-primary transition-colors uppercase">
            </div>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-white text-sm font-medium">Complemento / Tipo (Casa, Trabalho)</label>
            <input formControlName="type" type="text" placeholder="Ex: Casa" class="w-full bg-background text-white border border-gray rounded-xl py-3 px-4 outline-none focus:border-primary transition-colors placeholder:text-subtext">
        </div>

        <label class="flex items-center gap-3 cursor-pointer mt-2 group">
            <div class="w-5 h-5 rounded border-2 flex items-center justify-center transition-colors" [class.border-primary]="addressForm.get('isDefault')?.value" [class.border-subtext]="!addressForm.get('isDefault')?.value">
                <div *ngIf="addressForm.get('isDefault')?.value" class="w-2.5 h-2.5 rounded-sm bg-primary animate-scale-in"></div>
            </div>

            <span class="text-sm font-medium text-white group-hover:text-primary transition-colors">Definir como endereço principal</span>
            <input type="checkbox" formControlName="isDefault" class="hidden">
        </label>

        <button type="submit" [disabled]="addressForm.invalid || isSubmitting" class="w-full py-4 mt-4 rounded-xl font-bold text-white transition-all btn-primary-gradient disabled:opacity-50 disabled:cursor-not-allowed">
            {{ isSubmitting ? 'Salvando...' : 'Salvar Endereço' }}
        </button>
    </form>
</div>
