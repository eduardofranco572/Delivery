
@if (isVisible){
    <div class="fixed inset-0 z-[100] flex items-center justify-center px-4 bg-black/80 backdrop-blur-md transition-all duration-500">
        <div class="bg-card border border-gray rounded-[2rem] p-10 flex flex-col items-center text-center shadow-2xl max-w-sm w-full animate-slide-in-right">
            <div class="mb-6 mt-4 relative flex justify-center items-center">
                <div class="w-28 h-28">
                    <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                        <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" />
                        <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
                    </svg>
                </div>
            </div>
            
            <h2 class="text-2xl font-bold text-white mb-3">Pedido Confirmado!</h2>
            <p class="text-subtext text-sm leading-relaxed mb-2">
                Tudo certo com o seu pagamento. A cozinha da Fornalha já começou a preparar o seu pedido.
            </p>
        </div>
    </div>
}
