<div class="fixed inset-0 z-[100] flex items-center justify-center px-4 bg-black/80 backdrop-blur-md transition-all duration-500">
    <div class="bg-card border border-gray rounded-[2rem] flex flex-col shadow-2xl max-w-md w-full animate-slide-in-right overflow-hidden">
        <div class="flex justify-between items-center p-6 border-b border-gray">
            <h3 class="text-xl font-bold text-white">Meus Endereços</h3>

            <button (click)="onClose()" class="text-subtext hover:text-white transition-colors p-2 rounded-full hover:bg-gray cursor-pointer">
                <lucide-icon name="x" class="w-6 h-6"></lucide-icon>
            </button>
        </div>

        <div class="p-6 flex flex-col gap-4 max-h-[60vh] overflow-y-auto scrollbar-hide">
            @for (addr of addresses; track addr.id) {
                <div (click)="onSelect(addr)" 
                     class="flex items-start gap-4 p-4 rounded-xl border cursor-pointer transition-all duration-300 group"
                     [class.border-primary]="userAddress?.id === addr.id"
                     [class.bg-primary/5]="userAddress?.id === addr.id"
                     [class.border-gray]="userAddress?.id !== addr.id"
                     [class.bg-background]="userAddress?.id !== addr.id"
                     [class.hover:border-primary/50]="userAddress?.id !== addr.id">
                    
                    <div class="mt-1 shrink-0">
                        <div class="w-10 h-10 rounded-full border flex items-center justify-center transition-colors"
                             [class.bg-background]="userAddress?.id !== addr.id"
                             [class.border-primary]="userAddress?.id === addr.id"
                             [class.text-primary]="userAddress?.id === addr.id"
                             [class.border-gray]="userAddress?.id !== addr.id"
                             [class.text-subtext]="userAddress?.id !== addr.id">
                            <lucide-icon name="map-pin" class="w-5 h-5" [class.fill-primary/20]="userAddress?.id === addr.id"></lucide-icon>
                        </div>
                    </div>

                    <div class="flex flex-col flex-1">
                        <div class="flex justify-between items-start gap-2">
                            <span class="text-white font-bold text-base leading-tight">{{ addr.street }}, {{ addr.number }}</span>
                            @if (addr.isDefault) {
                                <span class="text-[10px] font-bold uppercase tracking-wider bg-primary/20 text-primary px-2 py-0.5 rounded-md shrink-0">Principal</span>
                            }
                        </div>
                        
                        <span class="text-subtext text-sm mt-1">{{ addr.type }} • {{ addr.neighborhood }}</span>
                        <span class="text-subtext text-xs mt-0.5">{{ addr.city }} - {{ addr.state }}</span>
                    </div>
                </div>
            }

            @if (addresses.length === 0) {
                <div class="text-center text-subtext py-6">
                    Você ainda não tem endereços cadastrados.
                </div>
            }
        </div>

        <div class="p-6 border-t border-gray bg-card">
            <button class="w-full py-4 rounded-xl border border-dashed border-subtext text-subtext font-bold flex items-center justify-center gap-2 hover:border-primary hover:text-primary hover:bg-primary/5 transition-all cursor-pointer">
                <lucide-icon name="plus" class="w-5 h-5"></lucide-icon>
                Adicionar novo endereço
            </button>
        </div>
    </div>
</div>
