<app-auth-layout 
    title="Bem-vindo de volta" 
    subtitle="Entre com seus dados para continuar seu pedido.">
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmitForm()" class="flex flex-col gap-6">
        <app-form-input 
            formControlName="email" 
            type="email" 
            label="E-mail" 
            placeholder="voce@email.com">
            <lucide-icon icon name="mail" class="h-5 w-5"></lucide-icon>
        </app-form-input>

        <app-form-input 
            formControlName="password" 
            type="password" 
            label="Senha" 
            placeholder="••••••••">
            <lucide-icon icon name="lock" class="h-5 w-5"></lucide-icon>
        </app-form-input>

        <div class="flex justify-end mt-[-12px]">
            <a href="#" class="text-primary text-sm font-medium hover:underline">Esqueci a senha</a>
        </div>

        <button type="submit" class="w-full py-4 mt-2 rounded-xl font-bold text-white transition-all btn-primary-gradient">
            Entrar
        </button>
        
    </form>

    <div class="flex items-center my-8">
        <div class="flex-grow border-t border-gray"></div>
            <span class="px-4 text-subtext text-sm">ou</span>
        <div class="flex-grow border-t border-gray"></div>
    </div>

    <button type="button" class="w-full flex items-center justify-center gap-3 py-3.5 rounded-xl border border-gray text-white hover:bg-card transition-colors">
        <svg class="h-5 w-5" viewBox="0 0 24 24">
            <path fill="currentColor" d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81Z"/>
        </svg>

        Continuar com Google
    </button>

    <p class="text-center text-subtext mt-8 text-sm">
        Não tem conta? <a routerLink="/signup" class="text-primary font-medium hover:underline">Cadastre-se</a>
    </p>

</app-auth-layout>
