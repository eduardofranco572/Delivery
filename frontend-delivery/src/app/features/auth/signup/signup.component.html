<app-auth-layout 
    title="Seja bem vindo" 
    subtitle="Preencha seus dados para criar sua conta.">
    
    <form [formGroup]="signupForm" (ngSubmit)="onSubmitForm()" class="flex flex-col gap-6">
        <app-form-input 
            formControlName="name" 
            label="Nome" 
            placeholder="Seu nome">
            <lucide-icon icon name="user" class="h-5 w-5"></lucide-icon>
        </app-form-input>

        <app-form-input 
            formControlName="email" 
            type="email" 
            label="E-mail" 
            placeholder="voce@email.com">
            <lucide-icon icon name="mail" class="h-5 w-5"></lucide-icon>
        </app-form-input>

        <app-form-input 
            formControlName="password" 
            type="password" 
            label="Senha" 
            placeholder="Sua senha">
            <lucide-icon icon name="lock" class="h-5 w-5"></lucide-icon>
        </app-form-input>

        <button type="submit" class="w-full py-4 mt-2 rounded-xl font-bold text-white transition-all btn-primary-gradient">
            Cadastrar
        </button>
    </form>

     <div class="flex items-center my-8">
        <div class="flex-grow border-t border-gray"></div>
            <span class="px-4 text-subtext text-sm">ou</span>
        <div class="flex-grow border-t border-gray"></div>
    </div>

    <p class="text-center text-subtext mt-8 text-sm">
        Já tem conta? <a routerLink="/login" class="text-primary font-medium hover:underline">Faça login</a>
    </p>
    
</app-auth-layout>
