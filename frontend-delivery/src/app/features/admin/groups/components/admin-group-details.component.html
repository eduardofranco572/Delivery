<div class="flex flex-col gap-6 pb-12">
    <header class="flex items-center gap-4 border-b border-gray pb-6">
        <button (click)="goBack()" class="w-10 h-10 rounded-full bg-card border border-gray flex items-center justify-center text-subtext hover:text-white hover:bg-gray transition-all cursor-pointer">
            <lucide-icon name="arrow-left" class="w-5 h-5"></lucide-icon>
        </button>

        <h2 class="text-2xl font-bold text-white">{{ isEditMode ? 'Editando Grupo' : 'Cadastrar Novo Grupo' }}</h2>
    </header>

    <form [formGroup]="groupForm" (ngSubmit)="saveGroup()" class="flex flex-col gap-6 max-w-2xl">
        <section class="bg-card border border-gray rounded-2xl p-6 shadow-lg">
            <h3 class="text-lg font-bold text-white mb-6">Informações do Grupo</h3>
            
            <div class="grid grid-cols-1 gap-5">
                <app-form-input 
                    formControlName="name" 
                    label="Nome do Grupo" 
                    placeholder="Ex: Tamanhos, Adicionais..."
                    [hasIcon]="false"
                    bgColor="bg-background">
                </app-form-input>
            </div>
        </section>

        <div class="flex flex-col sm:flex-row justify-end gap-4 mt-2">
            @if (isEditMode) {
                <button 
                    type="button" 
                    (click)="deleteGroup()" 
                    class="w-full sm:w-auto py-3.5 px-8 rounded-xl font-bold bg-red-500/10 text-red-500 border border-red-500/30 hover:bg-red-500 hover:text-white transition-all order-2 sm:order-1"
                >
                    Excluir Permanentemente
                </button>
            }
            
            <button 
                type="submit" 
                [disabled]="groupForm.invalid || isSaving" 
                class="w-full sm:w-auto py-3.5 px-10 rounded-xl font-bold text-white transition-all btn-primary-gradient disabled:opacity-50 disabled:cursor-not-allowed shadow-xl hover:brightness-110 active:scale-[0.98] order-1 sm:order-2"
            >
                {{ isSaving ? 'Salvando...' : 'Salvar Grupo' }}
            </button>
        </div>
    </form>
</div>
