<div class="min-h-screen bg-background flex flex-col md:flex-row">
    <header class="md:hidden flex items-center justify-between p-4 bg-card border-b border-gray sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <h1 class="text-white font-bold">Painel Admin</h1>
        </div>

        <button (click)="toggleMenu()" class="text-white p-2">
            <lucide-icon name="menu" class="w-6 h-6"></lucide-icon>
        </button>
    </header>

    <aside [class.translate-x-0]="isMobileMenuOpen" [class.-translate-x-full]="!isMobileMenuOpen" class="w-full md:w-64 bg-card border-r border-gray fixed md:sticky top-0 h-screen flex flex-col z-50 transition-transform duration-300 md:translate-x-0">
        <div class="h-20 flex items-center justify-between px-6 border-b border-gray shrink-0">
            <div class="flex items-center gap-3">
                <h1 class="text-white font-bold text-lg tracking-wide">Painel Admin</h1>
            </div>

            <button (click)="toggleMenu()" class="md:hidden text-subtext hover:text-white p-2">
                <lucide-icon name="x" class="w-6 h-6"></lucide-icon>
            </button>
        </div>

        <nav class="flex-1 py-6 px-4 flex flex-col gap-2 overflow-y-auto scrollbar-hide">
            <a routerLink="/admin/dashboard" (click)="toggleMenu()" routerLinkActive="bg-primary/10 text-primary border-primary/50" class="flex items-center gap-3 px-4 py-3 rounded-xl text-subtext font-medium hover:text-white hover:bg-gray border border-transparent transition-all">
                <lucide-icon name="layout-dashboard" class="w-5 h-5"></lucide-icon> Dashboard
            </a>

            <a routerLink="/admin/products" (click)="toggleMenu()" routerLinkActive="bg-primary/10 text-primary border-primary/50" class="flex items-center gap-3 px-4 py-3 rounded-xl text-subtext font-medium hover:text-white hover:bg-gray border border-transparent transition-all">
                <lucide-icon name="shopping-bag" class="w-5 h-5"></lucide-icon> Produtos
            </a>

            <a routerLink="/admin/preferences" (click)="toggleMenu()" routerLinkActive="bg-primary/10 text-primary border-primary/50" class="flex items-center gap-3 px-4 py-3 rounded-xl text-subtext font-medium hover:text-white hover:bg-gray border border-transparent transition-all">
                <lucide-icon name="clipboard-list" class="w-5 h-5"></lucide-icon> Cad. Preferências
            </a>

            <a routerLink="/admin/groups" (click)="toggleMenu()" routerLinkActive="bg-primary/10 text-primary border-primary/50" class="flex items-center gap-3 px-4 py-3 rounded-xl text-subtext font-medium hover:text-white hover:bg-gray border border-transparent transition-all">
                <lucide-icon name="layers" class="w-5 h-5"></lucide-icon> Grupo de Pref.
            </a>

            <div class="mt-auto flex flex-col gap-2 border-t border-gray pt-4">
                <a routerLink="/admin/perfil" (click)="toggleMenu()" routerLinkActive="bg-primary/10 text-primary border-primary/50" class="flex items-center gap-3 px-4 py-3 rounded-xl text-subtext font-medium hover:text-white hover:bg-gray border border-transparent transition-all">
                    <lucide-icon name="user" class="w-5 h-5"></lucide-icon> Perfil
                </a>

                <a routerLink="/home" class="flex items-center gap-3 px-4 py-3 rounded-xl text-subtext font-medium hover:text-primary hover:bg-primary/10 border border-transparent transition-all">
                    <lucide-icon name="arrow-left" class="w-5 h-5"></lucide-icon> Ir para Loja
                </a>
            </div>
        </nav>
    </aside>

    <main class="flex-1 p-4 md:p-8 min-h-screen flex justify-center items-start overflow-x-hidden">
        <div class="w-full max-w-5xl bg-card border border-gray rounded-2xl md:rounded-[2rem] shadow-2xl p-4 md:p-8 min-h-[75vh] animate-slide-in-right">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
