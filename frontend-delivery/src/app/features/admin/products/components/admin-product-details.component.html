<div class="flex flex-col gap-6 pb-12">
    <header class="flex items-center gap-4 border-b border-gray pb-6">
        <button 
            (click)="goBack()" 
            class="w-10 h-10 rounded-full bg-card border border-gray flex items-center justify-center text-subtext hover:text-white hover:bg-gray transition-all cursor-pointer shrink-0"
        >
            <lucide-icon name="arrow-left" class="w-5 h-5"></lucide-icon>
        </button>

        <h2 class="text-2xl font-bold text-white">{{ isEditMode ? 'Editando Produto' : 'Cadastrar Novo Produto' }}</h2>
    </header>

    <form 
        [formGroup]="productForm" 
        (ngSubmit)="saveProduct()" 
        class="flex flex-col gap-6 max-w-4xl"
    >
        <section class="bg-card border border-gray rounded-2xl p-6 shadow-lg">
            <h3 class="text-lg font-bold text-white mb-6">Informações Básicas</h3>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div class="flex flex-col gap-1 sm:col-span-2">
                    <app-form-input 
                        formControlName="prodName" 
                        label="Nome do Produto" 
                        [hasIcon]="false"
                        bgColor="bg-background"
                    >
                    </app-form-input>
                </div>
                
                <app-form-input 
                    formControlName="prodCode" 
                    label="Código" 
                    placeholder="001"
                    [hasIcon]="false"
                    bgColor="bg-background"
                >
                </app-form-input>
        
                <div class="flex flex-col gap-1">
                    <label class="text-white text-sm font-medium">Valor de Venda (R$)</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-subtext font-bold">R$</span>
                        <input 
                            formControlName="prodOriginalPrice" 
                            type="text" 
                            (input)="onPriceInput($event)" 
                            placeholder="0,00" 
                            class="w-full bg-background text-green font-bold border border-gray rounded-xl py-3 pl-12 pr-4 outline-none focus:border-primary transition-colors"
                        >
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-white text-sm font-medium">Grupo (Categoria)</label>
                    <ng-select 
                        formControlName="prodGroup" 
                        [items]="categories" 
                        bindLabel="catName" 
                        bindValue="catName" 
                        placeholder="Selecione o grupo..." 
                        class="dark-theme" 
                        [addTag]="addCustomCategory" 
                        addTagText="Adicionar novo grupo">
                    </ng-select>
                </div>

                <app-form-input 
                    formControlName="prodSize" 
                    label="Tamanho" 
                    placeholder="Ex: Grande"
                    [hasIcon]="false"
                    bgColor="bg-background"
                >
                </app-form-input>

            </div>
        </section>

        <section class="bg-card border border-gray rounded-2xl p-6 shadow-lg">
            <h3 class="text-lg font-bold text-white mb-6">Detalhes e Opcionais</h3>
            
            <div class="flex flex-col gap-4">
                <div class="flex flex-col gap-1">
                    <label class="text-white text-sm font-medium">Ingredientes / Descrição</label>
                    <textarea 
                        formControlName="prodDescription" 
                        class="w-full bg-background text-white border border-gray rounded-xl p-4 outline-none focus:border-primary transition-colors min-h-[7.5rem] resize-none">
                    </textarea>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-white text-sm font-medium">Grupo de Preferência</label>
                    <ng-select 
                        formControlName="preferenceGroupId" 
                        [items]="preferenceGroups" 
                        bindLabel="name" 
                        bindValue="id" 
                        placeholder="Selecione os opcionais..." class="dark-theme">
                    </ng-select>
                </div>
            </div>
        </section>

        <section class="bg-card border border-gray rounded-2xl p-6 shadow-lg">
            <h3 class="text-lg font-bold text-white mb-4">Imagem do Produto</h3>

            <div 
                class="relative w-full max-w-md aspect-square rounded-2xl border-2 border-dashed border-gray bg-background overflow-hidden cursor-pointer group flex items-center justify-center transition-colors hover:border-primary/50" 
                (click)="fileInput.click()"
            >
                @if (imagePreview) {
                    <img [src]="imagePreview" class="w-full h-full object-cover">
                    
                    <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center transition-opacity">
                        <lucide-icon name="pencil" class="w-6 h-6 text-white mb-1"></lucide-icon>
                        <span class="text-white font-bold text-sm">Trocar Imagem</span>
                    </div>

                } @else {
                    <div class="flex flex-col items-center text-subtext group-hover:text-primary transition-colors">
                        <lucide-icon name="image" class="w-10 h-10 mb-3 opacity-50"></lucide-icon>
                        <span class="text-sm font-medium">Fazer Upload</span>
                    </div>
                }
            </div>

            <input 
                type="file" 
                #fileInput 
                class="hidden" 
                accept="image/*" 
                (change)="onImageSelected($event)"
            >
        </section>

        <div class="flex flex-col sm:flex-row justify-end gap-4 mt-2">
            @if (isEditMode) {
                <button 
                    type="button" 
                    (click)="deleteProduct()" 
                    class="w-full sm:w-auto py-3.5 px-8 rounded-xl font-bold bg-red-500/10 text-red-500 border border-red-500/30 hover:bg-red-500 hover:text-white transition-all order-2 sm:order-1"
                >
                    Excluir Permanentemente
                </button>
            }

            <button 
                type="submit" [disabled]="productForm.invalid || isSaving" 
                class="w-full sm:w-auto py-3.5 px-10 rounded-xl font-bold text-white transition-all btn-primary-gradient disabled:opacity-50 disabled:cursor-not-allowed shadow-xl hover:brightness-110 active:scale-[0.98] order-1 sm:order-2"
            >
                {{ isSaving ? 'Salvando...' : 'Salvar Produto' }}
            </button>
        </div>
        
    </form>
</div>
