<div class="flex flex-col gap-2">
    @if (label) {
        <label class="text-white text-sm font-medium">{{ label }}</label>
    }
    
    <div class="relative group">
        @if (hasIcon) {
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-subtext">
                <ng-content select="[icon]"></ng-content>
            </span>
        }
        
        <input 
            [type]="inputType"
            [placeholder]="placeholder"
            [value]="value"
            [disabled]="isDisabled"
            [attr.maxlength]="maxlength" 
            [attr.step]="step" 
            (input)="onInput($event)"
            (blur)="onTouched()"
            class="w-full text-white border border-gray rounded-xl py-3 pr-4 outline-none hover:border-primary focus:border-primary transition-colors placeholder:text-[#555] disabled:opacity-50 {{ bgColor }} {{ customClass }}"
            [class.pl-12]="hasIcon"
            [class.pl-4]="!hasIcon"
        />
        
        @if (type === 'password') {
            <button 
                type="button" 
                (click)="togglePassword()" 
                class="absolute right-4 top-1/2 -translate-y-1/2 text-subtext hover:text-white transition-colors outline-none cursor-pointer">
                
                @if (showPassword) {
                    <lucide-icon name="eye-off" class="h-5 w-5"></lucide-icon>
                } @else {
                    <lucide-icon name="eye" class="h-5 w-5"></lucide-icon>
                }
            </button>
        }
    </div>
</div>
