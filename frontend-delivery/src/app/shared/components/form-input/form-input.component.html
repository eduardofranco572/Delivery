<div class="flex flex-col gap-2">
    <label class="text-white text-sm font-medium">{{ label }}</label>
    
    <div class="relative group">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-subtext">
            <ng-content select="[icon]"></ng-content>
        </span>
        
        <input 
            [type]="inputType"
            [placeholder]="placeholder"
            [value]="value"
            [disabled]="isDisabled"
            (input)="onInput($event)"
            (blur)="onTouched()"
            class="w-full bg-card text-white border border-gray rounded-xl py-3.5 pl-12 pr-12 outline-none hover:border-primary focus:border-primary transition-colors placeholder:text-[#555] disabled:opacity-50"
        />
        
        @if (type === 'password') {
            <button 
                type="button" 
                (click)="togglePassword()" 
                class="absolute right-4 top-1/2 -translate-y-1/2 text-subtext hover:text-white transition-colors outline-none cursor-pointer">
                
                @if (showPassword) {
                    <lucide-icon name="eye-off" class="h-5 w-5"></lucide-icon>
                } @else {
                    <lucide-icon name="eye" class="h-5 w-5"></lucide-icon>
                }
            </button>
        }
    </div>
</div>
