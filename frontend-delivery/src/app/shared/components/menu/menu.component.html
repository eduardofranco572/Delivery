<nav class="fixed bottom-0 md:bottom-auto md:top-0 left-0 w-full z-50 bg-[#110c08]/95 border-t md:border-b md:border-t-0 border-gray py-2 md:py-4 px-4 md:px-8 flex justify-between items-center transition-all">
    <div class="hidden md:flex items-center gap-3">
        <div class="w-12 h-12 bg-card border border-gray rounded-lg flex items-center justify-center shrink-0 shadow-lg relative overflow-hidden z-10 ">
            <img src="complogo.jpg" alt="Logo da Empresa" class="w-full h-full object-cover"/>
        </div>
        <div>
            <h1 class="text-xl font-bold text-white leading-tight">Fornalha</h1>
            <span class="text-sm text-subtext">Cozinha artesanal</span>
        </div>
    </div>
         
    <div class="flex items-center justify-around w-full md:w-auto md:gap-3">
        <button [class]="navButtonClass" routerLink="/orders">
            <lucide-icon name="clipboard-list" class="w-6 h-6 md:w-4 md:h-4"></lucide-icon>
            <span class="text-[0.6rem] md:text-sm font-medium">Pedidos</span>
        </button>
                 
        <button [class]="navButtonClass" (click)="onOpenCart()">
            <div class="relative">
                <lucide-icon name="shopping-bag" class="w-6 h-6 md:w-4 md:h-4"></lucide-icon>
                                 
                @if (cartCount() > 0) {
                    <span class="absolute -top-1.5 -right-1.5 md:-top-2 md:-right-2 bg-red-500 text-white text-[0.6rem] font-bold w-4 h-4 md:w-4 md:h-4 flex items-center justify-center rounded-full border border-background">
                        {{ cartCount() }}
                    </span>
                }
            </div>
            <span class="text-[0.6rem] md:text-sm font-medium">Carrinho</span>
        </button>
                 
        <button [class]="navButtonClass + ' bg-card hover:brightness-110'" routerLink="/profile">
            <lucide-icon name="user" class="w-6 h-6 md:w-4 md:h-4"></lucide-icon>
            <span class="text-[0.6rem] md:text-sm font-medium">Conta</span>
        </button>
    </div>
</nav>
